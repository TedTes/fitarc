<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calf raise prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0b0a09;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px;
  }
  .stage {
    position: relative;
    width: min(92vw, 360px);
    aspect-ratio: 512 / 768;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  canvas { width: 100%; height: 100%; display: block; }
  .controls {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 8px 10px;
  }
  button {
    appearance: none; border: none; cursor: pointer;
    color: #f5efe9; background: rgba(255,255,255,0.08);
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    transition: background 120ms ease, transform 80ms ease;
  }
  button:active { transform: scale(0.94); }
  button:hover { background: rgba(255,255,255,0.16); }
  .icon-btn { width: 44px; height: 44px; font-size: 18px; }
  .icon-btn.primary { width: 52px; height: 52px; font-size: 20px; background: #F48D4D; color: #241304; }
  .icon-btn.primary:hover { background: #f79d64; }
  .speeds { display: flex; gap: 4px; }
  .speeds button {
    height: 32px; padding: 0 12px; font-size: 13px; font-variant-numeric: tabular-nums;
    border-radius: 999px; color: #c9c2ba;
  }
  .speeds button.active { background: #F48D4D; color: #241304; font-weight: 600; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="stage"></canvas>
  </div>
  <div class="controls">
    <button class="icon-btn" id="replay" aria-label="Replay" title="Replay">⟲</button>
    <button class="icon-btn primary" id="playPause" aria-label="Play" title="Play">▶</button>
    <div class="speeds" role="group" aria-label="Playback speed">
      <button data-speed="0.5">0.5×</button>
      <button data-speed="1" class="active">1×</button>
      <button data-speed="2">2×</button>
    </div>
  </div>

  <script type="module">
    import { createPreview } from './renderer.js';

    const canvas = document.getElementById('stage');
    const playPauseBtn = document.getElementById('playPause');
    const replayBtn = document.getElementById('replay');
    const speedBtns = Array.from(document.querySelectorAll('.speeds button'));

    createPreview(canvas).then((preview) => {
      const setPlaying = (playing) => {
        playPauseBtn.textContent = playing ? '❙❙' : '▶';
        playPauseBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
        playPauseBtn.title = playing ? 'Pause' : 'Play';
      };

      playPauseBtn.addEventListener('click', () => {
        if (preview.isPlaying()) { preview.pause(); setPlaying(false); }
        else { preview.play(); setPlaying(true); }
      });

      replayBtn.addEventListener('click', () => {
        preview.replay();
        setPlaying(true);
      });

      speedBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          speedBtns.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          preview.setSpeed(parseFloat(btn.dataset.speed));
        });
      });

      // Start paused on the rest pose so the first thing you see isn't mid-motion.
      setPlaying(false);

      // Debug/QA aid: ?u=0.5 freezes on an exact pose instead of playing.
      const u = new URLSearchParams(location.search).get('u');
      if (u !== null) preview.seek(parseFloat(u));
      window.__preview = preview;
    });
  </script>
</body>
</html>
